<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Mainstay ecosystem</title>
  <desc id="desc">Mainstay and the nine products in its family: Safebox Web, OakGate, OpenQR, Clear, OpenETR, Acorn, Spurline, Grove, and Stroma.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="60" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="0.55" stop-color="#edf3ff"/>
      <stop offset="1" stop-color="#fff8eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#173b78" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M80 126 800 38l720 88" fill="none" stroke="#2f66d8" stroke-width="3" stroke-opacity="0.16"/>
  <path d="M80 808 800 862l720-54" fill="none" stroke="#e4a53a" stroke-width="3" stroke-opacity="0.2"/>
  <text x="800" y="65" fill="#173b78" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="6" text-anchor="middle">THE MAINSTAY ECOSYSTEM</text>
  <g filter="url(#shadow)"><rect x="685" y="88" width="230" height="188" rx="26" fill="#ffffff"/></g>
  <image x="731" y="100" width="138" height="138" preserveAspectRatio="xMidYMid meet" xlink:href="mainstay-logo.svg" href="mainstay-logo.svg"/>
  <text x="800" y="258" fill="#173b78" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Mainstay</text>
  <path d="M800 285v18M298 303h1004" fill="none" stroke="#2f66d8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.22"/>
  <g filter="url(#shadow)" fill="#ffffff">
    <rect x="145" y="324" width="410" height="142" rx="22"/><rect x="595" y="324" width="410" height="142" rx="22"/><rect x="1045" y="324" width="410" height="142" rx="22"/>
    <rect x="145" y="493" width="410" height="142" rx="22"/><rect x="595" y="493" width="410" height="142" rx="22"/><rect x="1045" y="493" width="410" height="142" rx="22"/>
    <rect x="145" y="662" width="410" height="142" rx="22"/><rect x="595" y="662" width="410" height="142" rx="22"/><rect x="1045" y="662" width="410" height="142" rx="22"/>
  </g>
  <g>
    <image x="175" y="345" width="100" height="100" preserveAspectRatio="xMidYMid meet" xlink:href="safebox-logo.png" href="safebox-logo.png"/>
    <image x="625" y="345" width="100" height="100" preserveAspectRatio="xMidYMid meet" xlink:href="oakgate-logo.png" href="oakgate-logo.png"/>
    <image x="1075" y="345" width="100" height="100" preserveAspectRatio="xMidYMid meet" xlink:href="openqr-logo.svg" href="openqr-logo.svg"/>
    <image x="175" y="514" width="100" height="100" preserveAspectRatio="xMidYMid meet" xlink:href="clear-logo.svg" href="clear-logo.svg"/>
    <image x="625" y="514" width="100" height="100" preserveAspectRatio="xMidYMid meet" xlink:href="openetr-logo.png" href="openetr-logo.png"/>
    <image x="1075" y="514" width="100" height="100" preserveAspectRatio="xMidYMid meet" xlink:href="acorn-logo.png" href="acorn-logo.png"/>
    <image x="175" y="683" width="100" height="100" preserveAspectRatio="xMidYMid meet" xlink:href="spurline-logo.svg" href="spurline-logo.svg"/>
    <image x="625" y="683" width="100" height="100" preserveAspectRatio="xMidYMid meet" xlink:href="grove-logo.png" href="grove-logo.png"/>
    <image x="1075" y="683" width="100" height="100" preserveAspectRatio="xMidYMid meet" xlink:href="stroma-logo.png" href="stroma-logo.png"/>
  </g>
  <g fill="#173b78" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">
    <text x="300" y="383">Safebox Web</text><text x="300" y="418" fill="#455777" font-size="17" font-weight="400">direct access</text>
    <text x="750" y="383">OakGate</text><text x="750" y="418" fill="#455777" font-size="17" font-weight="400">managed access</text>
    <text x="1200" y="383">OpenQR</text><text x="1200" y="418" fill="#455777" font-size="17" font-weight="400">scan and inspect</text>
    <text x="300" y="552">Clear</text><text x="300" y="587" fill="#455777" font-size="17" font-weight="400">community value</text>
    <text x="750" y="552">OpenETR</text><text x="750" y="587" fill="#455777" font-size="17" font-weight="400">verifiable evidence</text>
    <text x="1200" y="552">Acorn</text><text x="1200" y="587" fill="#455777" font-size="17" font-weight="400">portable authority</text>
    <text x="300" y="721">Spurline</text><text x="300" y="756" fill="#455777" font-size="17" font-weight="400">signed events</text>
    <text x="750" y="721">Grove</text><text x="750" y="756" fill="#455777" font-size="17" font-weight="400">encrypted storage</text>
    <text x="1200" y="721">Stroma</text><text x="1200" y="756" fill="#455777" font-size="17" font-weight="400">protocol library</text>
  </g>
  <text x="800" y="858" fill="#2f66d8" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">One house. Distinct roles. Open protocols.</text>
</svg>
