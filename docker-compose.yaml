name: mainstay-local

services:
  mainstay-local:
    image: ${MAINSTAY_LOCAL_IMAGE:-mainstay-local:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command:
      - mainstay-local
      - serve
      - --config
      - /app/data/mainstay-local.json
      - --host
      - 0.0.0.0
      - --port
      - "8788"
    environment:
      MAINSTAY_LOCAL_HOST: 0.0.0.0
      MAINSTAY_LOCAL_PORT: 8788
      MAINSTAY_LOCAL_CONFIG: /app/data/mainstay-local.json
    ports:
      - "${MAINSTAY_LOCAL_BIND_ADDRESS:-0.0.0.0}:${MAINSTAY_LOCAL_PORT:-8788}:8788"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - mainstay-local-data:/app/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  spurline:
    image: ${MAINSTAY_SPURLINE_IMAGE:-mainstay-local-spurline:local}
    build:
      context: ../spurline
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SPURLINE_HOST: 0.0.0.0
      SPURLINE_PORT: 8080
      SPURLINE_DATABASE: /data/spurline.sqlite3
      SPURLINE_VERIFY_SIGNATURES: "${SPURLINE_VERIFY_SIGNATURES:-true}"
      SPURLINE_PUBLIC_URL: ws://spurline:8080
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - spurline-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  grove:
    image: ${MAINSTAY_GROVE_IMAGE:-mainstay-local-grove:local}
    build:
      context: ../grove
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      GROVE_DATA_DIR: /data
      GROVE_PUBLIC_URL: http://grove:8000
      GROVE_SERVER_NAME: grove
      GROVE_MAX_BLOB_SIZE: "${GROVE_MAX_BLOB_SIZE:-104857600}"
      GROVE_AUTH_CLOCK_SKEW_SECONDS: "${GROVE_AUTH_CLOCK_SKEW_SECONDS:-30}"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - grove-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  clear:
    image: ${MAINSTAY_CLEAR_IMAGE:-mainstay-local-clear:local}
    build:
      context: ../clear
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command:
      - clear
      - --host
      - 0.0.0.0
      - --port
      - "3339"
      - --database
      - /app/data/clear.sqlite3
      - --mint-url
      - "${CLEAR_MINT_URL:-http://clear:3339}"
      - --log-level
      - "${CLEAR_LOG_LEVEL:-info}"
    environment:
      CLEAR_MASTER_SECRET: "${CLEAR_MASTER_SECRET:?Set CLEAR_MASTER_SECRET in .env}"
      CLEAR_OPERATOR_TOKEN: "${CLEAR_OPERATOR_TOKEN:?Set CLEAR_OPERATOR_TOKEN in .env}"
      CLEAR_DATABASE: /app/data/clear.sqlite3
      CLEAR_MINT_URL: "${CLEAR_MINT_URL:-http://clear:3339}"
      CLEAR_CURRENCY_NAME: "${CLEAR_CURRENCY_NAME:-Mainstay Local Credits}"
      CLEAR_CURRENCY_ALIAS: "${CLEAR_CURRENCY_ALIAS:-Local Credits}"
      CLEAR_CURRENCY_UNIT_ALIAS: "${CLEAR_CURRENCY_UNIT_ALIAS:-credits}"
      CLEAR_MAX_ORDER: "${CLEAR_MAX_ORDER:-20}"
      CLEAR_ROOT_AUTHORITY_NPUB: "${CLEAR_ROOT_AUTHORITY_NPUB:-}"
      CLEAR_ROOT_WALLET: /app/data/clear-root-wallet.json
      CLEAR_ROOT_API_URL: http://127.0.0.1:3339
    expose:
      - "3339"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - clear-data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  mainstay-local-data:
  spurline-data:
  grove-data:
  clear-data:
