name: mainstay-local

services:
  mainstay-local:
    image: ${MAINSTAY_LOCAL_IMAGE:-mainstay-local:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command:
      - mainstay-local
      - serve
      - --config
      - /app/data/mainstay-local.json
      - --host
      - 0.0.0.0
      - --port
      - "8788"
    environment:
      MAINSTAY_LOCAL_HOST: 0.0.0.0
      MAINSTAY_LOCAL_PORT: 8788
      MAINSTAY_LOCAL_CONFIG: /app/data/mainstay-local.json
    ports:
      - "${MAINSTAY_LOCAL_BIND_ADDRESS:-0.0.0.0}:${MAINSTAY_LOCAL_PORT:-8788}:8788"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - mainstay-local-data:/app/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  safebox-web:
    image: ${SAFEBOX_IMAGE:-safebox-web:local}
    build:
      context: ../safebox-web
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      - --workers
      - "${SAFEBOX_WEB_WORKERS:-1}"
    depends_on:
      clear:
        condition: service_healthy
      grove:
        condition: service_healthy
      spurline:
        condition: service_healthy
    environment:
      SAFEBOX_COOKIE_KEY: "${SAFEBOX_COOKIE_KEY:?Run ./init-env.sh to generate SAFEBOX_COOKIE_KEY}"
      SAFEBOX_ONBOARD_INVITE_CODE: "${SAFEBOX_ONBOARD_INVITE_CODE:?Run ./init-env.sh to generate SAFEBOX_ONBOARD_INVITE_CODE}"
      SAFEBOX_ALLOW_INSECURE_HTTP: "${SAFEBOX_ALLOW_INSECURE_HTTP:-true}"
      SAFEBOX_SESSION_TTL_HOURS: "${SAFEBOX_SESSION_TTL_HOURS:-720}"
      SAFEBOX_WALLET_LOAD_TIMEOUT_SECONDS: "${SAFEBOX_WALLET_LOAD_TIMEOUT_SECONDS:-20}"
      SAFEBOX_WALLET_HOME_SNAPSHOT_TIMEOUT_SECONDS: "${SAFEBOX_WALLET_HOME_SNAPSHOT_TIMEOUT_SECONDS:-3}"
      SAFEBOX_RECORD_CATALOG_TIMEOUT_SECONDS: "${SAFEBOX_RECORD_CATALOG_TIMEOUT_SECONDS:-10}"
      SAFEBOX_PAYMENT_TIMEOUT_SECONDS: "${SAFEBOX_PAYMENT_TIMEOUT_SECONDS:-90}"
      SAFEBOX_BACKGROUND_JOB_THREADS: "${SAFEBOX_BACKGROUND_JOB_THREADS:-2}"
      SAFEBOX_DEFAULT_BOOTSTRAP_RELAY: "${SAFEBOX_DEFAULT_BOOTSTRAP_RELAY:-ws://spurline:8080}"
      SAFEBOX_ALLOWED_WS_RELAYS: "${SAFEBOX_ALLOWED_WS_RELAYS:-ws://spurline:8080}"
      SAFEBOX_DEFAULT_HOME_MINT: "${MAINSTAY_LIGHTNING_MINT_URL:-https://mint.safebox.dev}"
      SAFEBOX_BLOSSOM_HOME_SERVER: "${SAFEBOX_BLOSSOM_HOME_SERVER:-http://grove:8000}"
      SAFEBOX_DATABASE_URL: "${SAFEBOX_DATABASE_URL:-sqlite:///data/database.db}"
      SAFEBOX_CLEAR_RECEIVE_ENABLED: "${SAFEBOX_CLEAR_RECEIVE_ENABLED:-true}"
      SAFEBOX_CLEAR_MINTS: "http://clear:3339,${MAINSTAY_EXTERNAL_CLEAR_MINT_URL:-https://clear.safebox.dev}"
      SAFEBOX_CLEAR_UNITS: "${SAFEBOX_CLEAR_UNITS:-}"
      SAFEBOX_PROVIDER_INVOICE_WAIT_SECONDS: "${SAFEBOX_PROVIDER_INVOICE_WAIT_SECONDS:-10}"
      SAFEBOX_NIP57_REQUIRE_DESCRIPTION_HASH: "${SAFEBOX_NIP57_REQUIRE_DESCRIPTION_HASH:-false}"
      SAFEBOX_CURRENCY_RATES_ENABLED: "${SAFEBOX_CURRENCY_RATES_ENABLED:-false}"
      SAFEBOX_SERVICE_ACORN_HOME_RELAY: "${SAFEBOX_SERVICE_ACORN_HOME_RELAY:-ws://spurline:8080}"
      SAFEBOX_SERVICE_ACORN_HOME_MINT: "${MAINSTAY_LIGHTNING_MINT_URL:-https://mint.safebox.dev}"
      SAFEBOX_SERVICE_ACORN_ENABLED: "true"
      SAFEBOX_SERVICE_ACORN_GIFT_WRAP_RETENTION_SECONDS: "${SAFEBOX_SERVICE_ACORN_GIFT_WRAP_RETENTION_SECONDS:-604800}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    ports:
      - "${MAINSTAY_SAFEBOX_BIND_ADDRESS:-0.0.0.0}:${MAINSTAY_SAFEBOX_PORT:-8888}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - safebox-web-data:/app/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 120s

  service-acorn-worker:
    image: ${SAFEBOX_IMAGE:-safebox-web:local}
    command: ["python", "-m", "app.service_acorn_worker", "run"]
    restart: unless-stopped
    init: true
    depends_on:
      safebox-web:
        condition: service_healthy
      spurline:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, os; path=os.getenv('SAFEBOX_SERVICE_ACORN_STATE_FILE', 'data/service-acorn.json'); state=json.load(open(path)); assert state.get('initialized') is True"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    environment:
      SAFEBOX_WALLET_LOAD_TIMEOUT_SECONDS: "${SAFEBOX_WALLET_LOAD_TIMEOUT_SECONDS:-20}"
      SAFEBOX_PAYMENT_TIMEOUT_SECONDS: "${SAFEBOX_PAYMENT_TIMEOUT_SECONDS:-90}"
      SAFEBOX_DATABASE_URL: "${SAFEBOX_DATABASE_URL:-sqlite:///data/database.db}"
      SAFEBOX_SERVICE_ACORN_POLL_SECONDS: "${SAFEBOX_SERVICE_ACORN_POLL_SECONDS:-0.5}"
      SAFEBOX_SERVICE_ACORN_DELIVERY_RETRY_ATTEMPTS: "${SAFEBOX_SERVICE_ACORN_DELIVERY_RETRY_ATTEMPTS:-4}"
      SAFEBOX_SERVICE_ACORN_DELIVERY_RETRY_BASE_SECONDS: "${SAFEBOX_SERVICE_ACORN_DELIVERY_RETRY_BASE_SECONDS:-2}"
      SAFEBOX_SERVICE_ACORN_DELIVERY_RETRY_MAX_SECONDS: "${SAFEBOX_SERVICE_ACORN_DELIVERY_RETRY_MAX_SECONDS:-60}"
      SAFEBOX_SERVICE_ACORN_ENABLED: "true"
      SAFEBOX_SERVICE_ACORN_MIGRATE: "${SAFEBOX_SERVICE_ACORN_MIGRATE:-false}"
      SAFEBOX_SERVICE_ACORN_HOME_RELAY: "${SAFEBOX_SERVICE_ACORN_HOME_RELAY:-ws://spurline:8080}"
      SAFEBOX_ALLOWED_WS_RELAYS: "${SAFEBOX_ALLOWED_WS_RELAYS:-ws://spurline:8080}"
      SAFEBOX_SERVICE_ACORN_HOME_MINT: "${MAINSTAY_LIGHTNING_MINT_URL:-https://mint.safebox.dev}"
      SAFEBOX_SERVICE_ACORN_STATE_FILE: "${SAFEBOX_SERVICE_ACORN_STATE_FILE:-data/service-acorn.json}"
      SAFEBOX_SERVICE_ACORN_GIFT_WRAP_RETENTION_SECONDS: "${SAFEBOX_SERVICE_ACORN_GIFT_WRAP_RETENTION_SECONDS:-604800}"
      SAFEBOX_NIP57_REQUIRE_DESCRIPTION_HASH: "${SAFEBOX_NIP57_REQUIRE_DESCRIPTION_HASH:-false}"
      SAFEBOX_CURRENCY_RATES_ENABLED: "${SAFEBOX_CURRENCY_RATES_ENABLED:-false}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - safebox-web-data:/app/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  spurline:
    image: ${MAINSTAY_SPURLINE_IMAGE:-mainstay-local-spurline:local}
    build:
      context: ../spurline
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SPURLINE_HOST: 0.0.0.0
      SPURLINE_PORT: 8080
      SPURLINE_DATABASE: /data/spurline.sqlite3
      SPURLINE_VERIFY_SIGNATURES: "${SPURLINE_VERIFY_SIGNATURES:-true}"
      SPURLINE_PUBLIC_URL: ws://spurline:8080
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - spurline-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  grove:
    image: ${MAINSTAY_GROVE_IMAGE:-mainstay-local-grove:local}
    build:
      context: ../grove
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      GROVE_DATA_DIR: /data
      GROVE_PUBLIC_URL: http://grove:8000
      GROVE_SERVER_NAME: grove
      GROVE_MAX_BLOB_SIZE: "${GROVE_MAX_BLOB_SIZE:-104857600}"
      GROVE_AUTH_CLOCK_SKEW_SECONDS: "${GROVE_AUTH_CLOCK_SKEW_SECONDS:-30}"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - grove-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  clear:
    image: ${MAINSTAY_CLEAR_IMAGE:-mainstay-local-clear:local}
    build:
      context: ../clear
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command:
      - clear
      - --host
      - 0.0.0.0
      - --port
      - "3339"
      - --database
      - /app/data/clear.sqlite3
      - --mint-url
      - "${CLEAR_MINT_URL:-http://clear:3339}"
      - --log-level
      - "${CLEAR_LOG_LEVEL:-info}"
    environment:
      CLEAR_MASTER_SECRET: "${CLEAR_MASTER_SECRET:?Set CLEAR_MASTER_SECRET in .env}"
      CLEAR_OPERATOR_TOKEN: "${CLEAR_OPERATOR_TOKEN:?Set CLEAR_OPERATOR_TOKEN in .env}"
      CLEAR_DATABASE: /app/data/clear.sqlite3
      CLEAR_MINT_URL: "${CLEAR_MINT_URL:-http://clear:3339}"
      CLEAR_CURRENCY_NAME: "${CLEAR_CURRENCY_NAME:-Mainstay Local Credits}"
      CLEAR_CURRENCY_ALIAS: "${CLEAR_CURRENCY_ALIAS:-Local Credits}"
      CLEAR_CURRENCY_UNIT_ALIAS: "${CLEAR_CURRENCY_UNIT_ALIAS:-credits}"
      CLEAR_MAX_ORDER: "${CLEAR_MAX_ORDER:-20}"
      CLEAR_ROOT_AUTHORITY_NPUB: "${CLEAR_ROOT_AUTHORITY_NPUB:-}"
      CLEAR_ROOT_WALLET: /app/data/clear-root-wallet.json
      CLEAR_ROOT_API_URL: http://127.0.0.1:3339
    expose:
      - "3339"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - clear-data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  mainstay-local-data:
  safebox-web-data:
  spurline-data:
  grove-data:
  clear-data:
