name: mainstay-local

services:
  mainstay-local:
    image: ${MAINSTAY_LOCAL_IMAGE:-mainstay-local:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mainstay-local
    restart: unless-stopped
    init: true
    command:
      - mainstay-local
      - serve
      - --config
      - /app/data/mainstay-local.json
      - --host
      - 0.0.0.0
      - --port
      - "8788"
    environment:
      MAINSTAY_LOCAL_HOST: 0.0.0.0
      MAINSTAY_LOCAL_PORT: 8788
      MAINSTAY_LOCAL_CONFIG: /app/data/mainstay-local.json
    ports:
      - "${MAINSTAY_LOCAL_BIND_ADDRESS:-0.0.0.0}:${MAINSTAY_LOCAL_PORT:-8788}:8788"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - mainstay-local-data:/app/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  mainstay-local-data:

networks:
  default:
    name: mainstay-local
