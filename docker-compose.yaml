name: mainstay-local

services:
  mainstay-local:
    image: ${MAINSTAY_LOCAL_IMAGE:-mainstay-local:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command:
      - mainstay-local
      - serve
      - --config
      - /app/data/mainstay-local.json
      - --host
      - 0.0.0.0
      - --port
      - "8788"
    environment:
      MAINSTAY_LOCAL_HOST: 0.0.0.0
      MAINSTAY_LOCAL_PORT: 8788
      MAINSTAY_LOCAL_CONFIG: /app/data/mainstay-local.json
    ports:
      - "${MAINSTAY_LOCAL_BIND_ADDRESS:-0.0.0.0}:${MAINSTAY_LOCAL_PORT:-8788}:8788"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - mainstay-local-data:/app/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  spurline:
    image: ${MAINSTAY_SPURLINE_IMAGE:-mainstay-local-spurline:local}
    build:
      context: ../spurline
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SPURLINE_HOST: 0.0.0.0
      SPURLINE_PORT: 8080
      SPURLINE_DATABASE: /data/spurline.sqlite3
      SPURLINE_VERIFY_SIGNATURES: "${SPURLINE_VERIFY_SIGNATURES:-true}"
      SPURLINE_PUBLIC_URL: ws://spurline:8080
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - spurline-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  mainstay-local-data:
  spurline-data:
