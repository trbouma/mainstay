[tool.poetry]
name = "mainstay-site"
version = "0.1.0"
description = "The flagship product site for the Mainstay local-first product family"
authors = ["Tim Bouma"]
license = "MIT"
readme = "README.md"
package-mode = false
homepage = "https://trbouma.github.io/mainstay/"
repository = "https://github.com/trbouma/mainstay"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0,<2.0.0"
mkdocs-material = ">=9.5.0,<10.0.0"
pymdown-extensions = ">=10.0.0,<11.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
